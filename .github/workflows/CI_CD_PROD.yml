name: CI_CD_BACKEND_PROD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  quality-security:
    name: Code Quality and Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: fs
          scan-ref: .

  docker-release:
    name: Build and Release Docker
    runs-on: ubuntu-latest
    needs: [quality-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute API image name
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (API service)
        run: |
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.run_number }}" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.run_number }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            generated github release
            - Docker image: ${{ env.IMAGE_NAME }}:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to VPS (Compose Prod)
    runs-on: ubuntu-latest
    needs: [ docker-release ]
    steps:
      - name: Checkout repository for deploy script
        uses: actions/checkout@v4

      - name: Deploy over SSH (Docker Compose)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          # Transfère uniquement docker-compose.yml et .env.prod
          source: "docker-compose.prod.yml,.env"
          target: "/home/deployer/apps/ecrireback/"
          envs: GH_USER,GH_TOKEN,GH_REPO
          script: |
            set -euo pipefail
            
            APP_NAME="$(basename "$GH_REPO" | tr '[:upper:]' '[:lower:]')"
            IMAGE_NAME="ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]')"
            
            BASE_DIR="$HOME/apps/$APP_NAME"
            cd "$BASE_DIR"
            
            # Authentification à GHCR si image privée
            echo "Logging into GitHub Container Registry..."
            if [ -n "${GH_TOKEN:-}" ]; then
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            fi
            
            # Définition des variables d'environnement à partir des secrets
            export MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_INITDB_ROOT_USERNAME }}"
            export MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}"
            export MONGO_DB="${{ secrets.MONGO_DB }}"
            export MONGO_APP_USER="${{ secrets.MONGO_APP_USER }}"
            export MONGO_APP_PASSWORD="${{ secrets.MONGO_APP_PASSWORD }}"
            export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            export ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}"
            export GIN_MODE="${{ secrets.GIN_MODE }}"
            export BACKEND_PORT=2427
            
            # Mise à jour de l'image dans le docker-compose
            sed -i "s|image: ghcr.io/.*:latest|image: ${IMAGE_NAME}:latest|" docker-compose.yml
            
            # Mise à jour de la variable de port dans le fichier .env.prod
            sed -i "s|BACKEND_PORT=.*|BACKEND_PORT=${BACKEND_PORT}|" .env.prod
            
            echo "Pulling latest images defined in docker-compose..."
            docker compose -f docker-compose.yml --env-file .env.prod pull
            
            echo "Starting/Updating services with Docker Compose..."
            docker compose -f docker-compose.yml --env-file .env.prod up -d --force-recreate
            
            docker image prune -f || true
            
            echo "Logging out from GitHub Container Registry..."
            if [ -n "${GH_TOKEN:-}" ]; then
              docker logout ghcr.io
            fi
            
            echo "Deployment complete."